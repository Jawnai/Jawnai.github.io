<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#1e3a8a" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#grad)" />
  
  <!-- Notebook shape -->
  <g filter="url(#shadow)" transform="translate(96, 80)">
    <!-- Cover Base -->
    <rect x="20" y="20" width="280" height="320" rx="24" fill="#ffffff" />
    
    <!-- Spine Accent -->
    <rect x="20" y="20" width="48" height="320" rx="16" fill="#e2e8f0" />
    <circle cx="44" cy="70" r="10" fill="#94a3b8" />
    <circle cx="44" cy="130" r="10" fill="#94a3b8" />
    <circle cx="44" cy="190" r="10" fill="#94a3b8" />
    <circle cx="44" cy="250" r="10" fill="#94a3b8" />
    <circle cx="44" cy="300" r="10" fill="#94a3b8" />

    <!-- Ruled lines -->
    <rect x="90" y="80" width="170" height="12" rx="6" fill="#3b82f6" opacity="0.8" />
    <rect x="90" y="120" width="140" height="10" rx="5" fill="#cbd5e1" />
    <rect x="90" y="155" width="180" height="10" rx="5" fill="#cbd5e1" />
    <rect x="90" y="190" width="120" height="10" rx="5" fill="#cbd5e1" />

    <!-- Coin / Badge icon -->
    <circle cx="210" cy="260" r="42" fill="#f59e0b" />
    <text x="210" y="276" font-family="sans-serif" font-size="44" font-weight="bold" fill="#ffffff" text-anchor="middle">฿</text>
  </g>
</svg>
